id: ai-secret-in-public-env
language: Tsx
severity: error
message: "Biến môi trường công khai (NEXT_PUBLIC_, VITE_...) đang chứa khoá bí mật"
note: |
  Mọi biến có tiền tố công khai bị nhét vào mã chạy ở trình duyệt, ai cũng đọc được.
  Sửa: bỏ tiền tố công khai, chỉ đọc khoá này ở máy chủ (API route, server action, Edge Function) và đổi (xoay) khoá đã lộ.
rule:
  any:
    - pattern: process.env.$NAME
    - pattern: import.meta.env.$NAME
constraints:
  NAME:
    regex: '^(NEXT_PUBLIC|VITE|REACT_APP|EXPO_PUBLIC|NUXT_PUBLIC|PUBLIC|GATSBY|PLASMO_PUBLIC)_.*(SERVICE_ROLE|SECRET|PRIVATE|PASSWORD)'
ignores:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/.next/**'
  - '**/out/**'
  - '**/kit/rules/fixtures/**'
  - '**/*.test.*'
  - '**/*.spec.*'
