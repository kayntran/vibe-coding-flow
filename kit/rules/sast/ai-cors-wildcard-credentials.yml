id: ai-cors-wildcard-credentials
language: Tsx
severity: error
message: "CORS cho mọi nguồn (origin * hoặc true) mà vẫn bật credentials"
note: |
  Trang web bất kỳ có thể gọi API bằng đăng nhập (cookie) của người dùng rồi đọc kết quả.
  Sửa: liệt kê đúng các origin tin cậy (mảng tên miền) khi cần credentials; origin * chỉ dùng cho API công khai không cookie.
rule:
  kind: object
  all:
    - has:
        kind: pair
        all:
          - has:
              field: key
              regex: '^["'']?(origin|Access-Control-Allow-Origin)["'']?$'
          - has:
              field: value
              regex: '^(["''`]\*["''`]|true)$'
    - has:
        kind: pair
        all:
          - has:
              field: key
              regex: '^["'']?(credentials|Access-Control-Allow-Credentials)["'']?$'
          - has:
              field: value
              regex: '^(true|["'']true["''])$'
ignores:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/.next/**'
  - '**/out/**'
  - '**/kit/rules/fixtures/**'
  - '**/*.test.*'
  - '**/*.spec.*'
